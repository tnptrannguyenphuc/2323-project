<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị - BookStore Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <!-- ========================================================
         TRANG ĐĂNG NHẬP ADMIN
         Nền xanh đậm, form card trắng ở giữa
         ======================================================== -->
    <div class="login-page">
        <div class="login-card">

            <!-- Logo admin -->
            <div class="login-logo">
                <h1>BookStore Admin</h1>
                <p>Hệ thống quản trị cửa hàng sách</p>
            </div>

            <!-- Form đăng nhập - chuyển thẳng tới Dashboard -->
            <div id="loginForm">

                <!-- Trường Email -->
                <div class="form-group">
                    <label for="email">
                        Email quản trị
                        <span class="required">*</span>
                    </label>
                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="admin@bookstore.vn"
                        value="admin@bookstore.vn"
                        required
                    >
                </div>

                <!-- Trường Mật khẩu -->
                <div class="form-group">
                    <label for="password">
                        Mật khẩu
                        <span class="required">*</span>
                    </label>
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Nhập mật khẩu..."
                        value="admin123"
                        required
                    >
                </div>

                <!-- Nút đăng nhập dẫn trực tiếp đến index.html không mang query string -->
                <a href="index.html" class="btn btn-primary" style="text-decoration:none;">
                    Đăng nhập quản trị
                </a>

            </div>

            <!-- Link quay về trang khách hàng -->
            <div class="login-footer">
                <a href="../index.html">← Quay về trang chủ khách hàng</a>
            </div>

        </div>
    </div>

</body>
</html>
